<div class="admin-shell">
  <div class="admin-shell__backdrop"></div>

  <app-sidebar
    [isCollapsed]="isSidebarCollapsed()"
    [mobileOpen]="mobileSidebarOpen()"
    (sidebarToggle)="onSidebarToggle()"
    (mobileSidebarToggle)="onMobileSidebarToggle()"
    (closeMobile)="closeMobileSidebar()">
  </app-sidebar>

  <div
    class="content-wrapper"
    [class.content-collapsed]="isSidebarCollapsed() && !isMobile()"
    [class.content-mobile]="isMobile()">
    <app-navbar
      [mobileSidebarOpen]="mobileSidebarOpen()"
      [shownatification]="shownatification()"
      (sidebarToggle)="onMobileSidebarToggle()">
    </app-navbar>

    <main class="admin-main">
      <section class="content-surface">
        <router-outlet></router-outlet>
      </section>
    </main>
  </div>
</div>

<div
  class="mobile-overlay d-lg-none"
  [class.d-none]="!mobileSidebarOpen()"
  (click)="toggleMobileSidebar()"></div>

@if (isSidebarCollapsed() && !isMobile()) {
  <button class="sidebar-reopen btn" type="button" (click)="toggleSidebar()" aria-label="Sidebari ac">

    <span class="sidebar-reopen__label">Menu</span>
  </button>
}

<button
  class="scroll-to-top btn"
  [class.d-none]="!showScrollButton()"
  (click)="scrollToTop()"
  aria-label="Sayfanin basina don">
  <i class="bi bi-chevron-up"></i>
</button>
