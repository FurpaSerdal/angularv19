<nav class="topbar">
  <div class="topbar__section topbar__section--start">
    <button
      class="topbar__toggle d-lg-none"
      type="button"
      (click)="onMobileToggle()"
      aria-label="Menuyu ac">
      <i class="bi fs-5" [ngClass]="getMobileMenuIcon()"></i>
    </button>

    <a routerLink="/admin" class="topbar__brand" aria-label="Furpa ana sayfa">
      <span class="topbar__brand-logo">
        <img src="assets/furpa-login.png" alt="Furpa logo" />
      </span>
    </a>

    <div class="topbar__headline">
      <span class="topbar__eyebrow">Operasyon Paneli</span>

      @if (userService.isLoading()) {
        <span class="topbar__loading">
          <span class="spinner-border spinner-border-sm" role="status" aria-hidden="true"></span>
          Veriler yukleniyor
        </span>
      } @else {
        <h1 class="topbar__title">{{ getUserDisplayName() }}</h1>
        <p class="topbar__subtitle">
          {{ getBranchDisplay() }}
          @if (shownatification) {
            <span class="topbar__badge">Sistem hazir</span>
          }
        </p>
      }
    </div>
  </div>

  <div class="topbar__section topbar__section--end">
    <div class="topbar__profile d-none d-md-flex" aria-hidden="true">
      <span class="topbar__avatar">{{ getUserInitials() }}</span>
      <div class="topbar__profile-copy">
        <strong>{{ userService.userSignal()?.sube || 'Sube' }}</strong>
        <small>Hizli erisim acik</small>
      </div>
    </div>

    <a routerLink="/admin" class="topbar__action topbar__action--ghost">
      <i class="bi bi-house-door"></i>
      <span class="d-none d-sm-inline">Anasayfa</span>
    </a>

    <button type="button" class="topbar__action topbar__action--danger" (click)="logout()">
      <i class="bi bi-box-arrow-right"></i>
      <span class="d-none d-sm-inline">Cikis</span>
    </button>
  </div>
</nav>
