<div class="pdf-preview-container bg-white rounded-4 shadow-lg overflow-hidden">
  <!-- Başlık ve Araç Çubuğu -->
  <div class="pdf-toolbar d-flex justify-content-between align-items-center px-4 py-3 bg-primary text-white">
    <h2 class="pdf-title mb-0 fs-5 fw-semibold">
      <i class="bi bi-file-earmark-pdf-fill me-2"></i>
      PDF Önizleme
    </h2>

    <div class="toolbar-actions d-flex gap-2">
 
      <button class="btn btn-outline-light text-white fw-semibold shadow-sm" (click)="indirPdf()">
        <i class="bi bi-download me-1"></i> İndir
      </button>
      <button class="btn btn-outline-light text-white fw-semibold shadow-sm" (click)="closeDialog()">
        <i class="bi bi-x-lg me-1"></i> Kapat
      </button>
    </div>
  </div>

  <!-- PDF Görüntüleme Alanı -->
  <div class="pdf-viewer-wrapper bg-light-subtle" style="height: 80vh;">
    <ng-container *ngIf="safePdfUrl; else loading">
      <iframe 
        [src]="safePdfUrl" 
        class="w-100  h-100"
        style="border-radius: 0 0 1rem 1rem; background: white;"
        title="PDF Önizleme">
      </iframe>
    </ng-container>
  <ng-template #loading>
    <div class="d-flex align-items-center justify-content-center h-100 text-muted">
      PDF yükleniyor...
    </div>
  </ng-template>

  </div>
</div>
