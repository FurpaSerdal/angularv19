<div class="container-fluid app-list-page">
    <div class="row">
      <div class="col-md-12 d-flex justify-content-between align-items-center">

           <div class="float-left">
          <mat-form-field>
            <mat-label>Arayabilirsiniz</mat-label>
            <input matInput (keyup)="filtreUygula($event)" placeholder="Evrak Seri, Kasa No, Z No">
          </mat-form-field>
        </div>
        <div class="float-right">
          <mat-form-field>
            <input matInput placeholder="Gün Seçiniz" [matDatepicker]="tarihSecici" [max]="maxTarih" (dateChange)="tarihDegisti($event)">
            <mat-datepicker-toggle matSuffix [for]="tarihSecici"></mat-datepicker-toggle>
            <mat-datepicker #tarihSecici></mat-datepicker>
          </mat-form-field>
        </div>
   
       
      </div>
    </div>
  
    <div class="table-responsive app-list-table mt-3">
      <table class="col-md-12" mat-table [dataSource]="tableSource" matSort>
      <ng-container matColumnDef="sube">
        <th mat-header-cell *matHeaderCellDef>Şube</th>
        <td mat-cell *matCellDef="let kayit">{{ kayit.warehouse }}</td>
      </ng-container>
  
      <ng-container matColumnDef="evrakSeri">
        <th mat-header-cell *matHeaderCellDef>Evrak Seri</th>
        <td mat-cell *matCellDef="let kayit">{{ kayit.documentSerie }}</td>
      </ng-container>
  
      <ng-container matColumnDef="evrakSiraNo">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>Evrak Sıra No</th>
        <td mat-cell *matCellDef="let kayit">{{ kayit.documentOrderNo }}</td>
      </ng-container>
  
      <ng-container matColumnDef="kasaNo">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>Kasa No</th>
        <td mat-cell *matCellDef="let kayit">{{ kayit.cashNo }}</td>
      </ng-container>
  
      <ng-container matColumnDef="zRaporNo">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>Z Rapor No</th>
        <td mat-cell *matCellDef="let kayit">{{ kayit.zReportNo }}</td>
      </ng-container>
  
      <ng-container matColumnDef="kasiyer">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>Kasiyer</th>
        <td mat-cell *matCellDef="let kayit">{{ kayit.cashierNo }}</td>
      </ng-container>
  
      <ng-container matColumnDef="duzenleyen">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>Düzenleyen</th>
        <td mat-cell *matCellDef="let kayit">{{ kayit.managerNo }}</td>
      </ng-container>
  
      <ng-container matColumnDef="toplam">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>Toplam</th>
        <td mat-cell *matCellDef="let kayit">{{ kayit.total | currency: ' ' }} TL</td>
      </ng-container>
  
      <ng-container matColumnDef="işlemler">
        <th mat-header-cell *matHeaderCellDef>İşlemler</th>
        <td mat-cell *matCellDef="let kayit">
          <button class="btn btn-info" (click)="detayGoster(kayit)">Detay</button>
        </td>
      </ng-container>
  
      <tr mat-header-row *matHeaderRowDef="tabloKolonlari; sticky: true"></tr>
      <tr mat-row *matRowDef="let satir; columns: tabloKolonlari"></tr>
      </table>
    </div>

    <div class="pagination-section mt-2" *ngIf="tableSource.data.length > 0">
      <mat-paginator
        [pageSize]="10"
        [pageSizeOptions]="[10, 25, 50]"
        showFirstLastButtons
        class="custom-paginator app-list-paginator">
      </mat-paginator>
    </div>
  </div>
