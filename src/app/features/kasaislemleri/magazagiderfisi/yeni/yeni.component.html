<div class="container-fluid">
    <div class="row">
      <div class="card">
        <div class="card-header d-flex justify-content-between align-items-center">
          <div class="div">
      <h3 class="card-title">Mağaza Gider Fişi Oluştur</h3>
          </div>
          <div class="div d-flex gap-2">
            <button class="btn btn-secondary" (click)="kapat()">Geri</button>
             <button class="btn btn-primary" (click)="kaydet()">Kaydet</button>
            </div>
    

        </div>
      </div>
  
    </div>
    <form [formGroup]="form" class="">
      
      <div class="row mb-3">
        <div class="col-md-6">
          <label for="olusturan" class="form-label">Oluşturan</label>
          <input
            type="text"
            id="olusturan"
            formControlName="olusturan"
            class="form-control"
            placeholder="Oluşturan kişiyi giriniz"
          />
        </div>
        <div class="col-md-6">
          <label for="onaylayan" class="form-label">Onaylayan</label>
          <input
            type="text"
            id="onaylayan"
            formControlName="onaylayan"
            class="form-control"
            placeholder="Onaylayan kişiyi giriniz"
          />
        </div>
      </div>
  
      <div class="row mb-3">
        <div class="col-md-6">
          <label for="urun" class="form-label">Ürün</label>
          <input
            type="text"
            id="urun"
            formControlName="urun"
            class="form-control"
            placeholder="Ürün adını giriniz"
          />
        </div>
        <div class="col-md-6">
          <label for="miktar" class="form-label">Miktar</label>
          <input
            type="text"
            id="miktar"
            formControlName="miktar"
            class="form-control"
            placeholder="Ürün miktarını giriniz"
          />
        </div>
      </div>
  
      <div class="row mb-3">
        <div class="col-md-12 text-end">
          <button type="button" class="btn btn-danger col-md-12" (click)="addUrun()">Ürün Ekle</button>
        </div>
      </div>
  
      <div class="row">
        <div class="col-md-12">
          <h5 class="mb-3 text-center">Ürün Listesi</h5>
          <div formArrayName="urunListesi">
            <table class="table table-bordered">
              <thead>
                <tr>
                  <th>Ürün</th>
                  <th>Miktar</th>
                  <th>İşlemler</th>
                </tr>
              </thead>
              <tbody>
                <tr *ngFor="let urun of urunListesi.controls; let i = index" [formGroupName]="i">
                  <td>{{ urun.get('urun')?.value }}</td>
                  <td>{{ urun.get('miktar')?.value }}</td>
                  <td>
                    <button type="button" class="btn btn-danger btn-sm" (click)="removeUrun(i)">Sil</button>
                  </td>
                </tr>
              </tbody>
            </table>
          </div>
        </div>
      </div>
    </form>
  </div>
