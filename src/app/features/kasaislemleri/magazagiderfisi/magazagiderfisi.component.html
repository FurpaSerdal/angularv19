<div class="container-fluid app-list-page">
<div class="row">

  <!-- Yeni Gider Fişi Butonu -->
  <div class="col-md-6 d-flex align-items-center">
    <button class="btn btn-primary" (click)="Yeni()">Yeni Gider Fişi</button>
  </div>

  <!-- Tarih Aralığı Seçimi -->
  <div class="col-md-6" [formGroup]="dateRangeForm">
    <div class="d-flex gap-2">
      <mat-form-field appearance="outline" class="flex-grow-1">
        <mat-label>Başlangıç Tarihi</mat-label>
        <input
          matInput
          formControlName="startDate"
          [matDatepicker]="startDatePicker"
          (dateChange)="onDateRangeChange()"
        />
        <mat-datepicker-toggle matSuffix [for]="startDatePicker"></mat-datepicker-toggle>
        <mat-datepicker #startDatePicker></mat-datepicker>
      </mat-form-field>

      <mat-form-field appearance="outline" class="flex-grow-1">
        <mat-label>Bitiş Tarihi</mat-label>
        <input
          matInput
          formControlName="endDate"
          [matDatepicker]="endDatePicker"
          (dateChange)="onDateRangeChange()"
        />
        <mat-datepicker-toggle matSuffix [for]="endDatePicker"></mat-datepicker-toggle>
        <mat-datepicker #endDatePicker></mat-datepicker>
      </mat-form-field>
    </div>
  </div>

</div>

  <div class="card shadow-sm border-0">
    <div class="card-body p-0">
      <div class="table-responsive app-list-table">
      
  <!-- Yükleme Göstergesi -->
  <div *ngIf="yukleniyor" class="d-flex flex-column justify-content-center align-items-center" style="min-height: 200px;">
    <mat-spinner color="primary" diameter="60"></mat-spinner>
  </div>

        <!-- Tablo -->
        <table mat-table [dataSource]="tableSource" class="w-100 mat-elevation-z8" matSort>
      <!-- Evrak Seri -->
      <ng-container matColumnDef="documentSerie">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>Evrak Seri</th>
        <td mat-cell *matCellDef="let outage">{{ outage.documentSerie }}</td>
      </ng-container>
  
      <!-- Evrak Sıra No -->
      <ng-container matColumnDef="documentOrderNo">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>Evrak Sıra No</th>
        <td mat-cell *matCellDef="let outage">{{ outage.documentOrderNo }}</td>
      </ng-container>
  
      <!-- Evrak Tarihi -->
      <ng-container matColumnDef="documentDate">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>Evrak Tarihi</th>
        <td mat-cell *matCellDef="let outage">{{ outage.documentDate | date:'dd/MM/yyyy' }}</td>
      </ng-container>
  
      <!-- Fire Fişi Toplam -->
      <ng-container matColumnDef="outageTotal">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>Fire Fişi Toplam</th>
        <td mat-cell *matCellDef="let outage">{{ outage.outageTotal.toFixed(2) }}</td>
      </ng-container>
  
      <!-- İşlemler -->
      <ng-container matColumnDef="operations">
        <th mat-header-cell *matHeaderCellDef>İşlemler</th>
        <td mat-cell *matCellDef="let outage">
          <button mat-button mat-flat-button color="primary" >
            <i class="fa fa-search"></i> Detay
          </button>
        </td>
      </ng-container>
  
      <!-- Tablo Satırları -->
      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
        </table>
      </div>
    </div>
  </div>

  <!-- Sayfalama -->
  <div class="pagination-section">
    <mat-paginator [pageSize]="10" [pageSizeOptions]="[10]" showFirstLastButtons class="custom-paginator app-list-paginator">
    </mat-paginator>
  </div>
